# Полный стек Tomato одним контейнером (backend раздаёт собранный frontend).
#   IMAGE_NAME=tomato docker compose -f deploy/docker-compose.yml up -d     # готовый образ
#   docker compose -f deploy/docker-compose.yml up -d --build                # собрать из исходников
# Прогресс игроков хранится в томе tomato-data и переживает перезапуск/обновление контейнера.
services:
  app:
    image: ${IMAGE_NAME:-tomato:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:3000"
    environment:
      # TOMATO_CORS_ORIGIN: "https://example.org"   # если frontend раздаётся с другого домена
      # TURN для голоса за NAT — см. backend/docs/VOICE.md
      TOMATO_TURN_URLS: ${TOMATO_TURN_URLS:-}
      TOMATO_TURN_SECRET: ${TOMATO_TURN_SECRET:-}
    volumes:
      - tomato-data:/data

  # Демо-стенд для жюри: ускоренные комнаты, только песочные аккаунты, отдельный том с БД.
  # docker compose -f deploy/docker-compose.yml --profile demo up -d demo
  demo:
    image: ${IMAGE_NAME:-tomato:local}
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DEMO_PORT:-8081}:3000"
    environment:
      TOMATO_DEMO: "1"
      TOMATO_DB: /data/tomato-demo.db
    volumes:
      - tomato-demo-data:/data

volumes:
  tomato-data:
  tomato-demo-data:
