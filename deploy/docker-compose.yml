# Полный стек Tomato одним контейнером (backend раздаёт собранный frontend).
#   IMAGE_NAME=tomato docker compose -f deploy/docker-compose.yml up -d     # готовый образ
#   docker compose -f deploy/docker-compose.yml up -d --build                # собрать из исходников
# Прогресс игроков хранится в томе tomato-data и переживает перезапуск/обновление контейнера.
services:
  app:
    image: ${IMAGE_NAME:-tomato:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:3000"
    environment:
      # TOMATO_CORS_ORIGIN: "https://example.org"   # если frontend раздаётся с другого домена
      # TURN для голоса за NAT — см. backend/docs/VOICE.md
      TOMATO_TURN_URLS: ${TOMATO_TURN_URLS:-}
      TOMATO_TURN_SECRET: ${TOMATO_TURN_SECRET:-}
    volumes:
      - tomato-data:/data

  # Демо-стенд для жюри: ускоренные комнаты, только песочные аккаунты, отдельный том с БД.
  # docker compose -f deploy/docker-compose.yml --profile demo up -d demo
  demo:
    image: ${IMAGE_NAME:-tomato:local}
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DEMO_PORT:-8081}:3000"
    environment:
      TOMATO_DEMO: "1"
      TOMATO_DB: /data/tomato-demo.db
    volumes:
      - tomato-demo-data:/data

  # HTTPS для голоса: браузер даёт микрофон только по HTTPS. Caddy сам получает сертификат Let's Encrypt.
  # Домена нет — подойдёт <IP>.sslip.io (резолвится в этот IP). Порт 80 тогда отдаём Caddy, а app переносим:
  #   APP_PORT=8080 PUBLIC_HOST=1.2.3.4.sslip.io docker compose -f deploy/docker-compose.yml --profile https up -d app https
  https:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${PUBLIC_HOST:-localhost} --to app:3000
    volumes:
      - caddy-data:/data

  # TURN-ретранслятор голоса: без него звонок не проходит между строгими NAT (мобильный интернет, офисы).
  # Секрет общий с app (TOMATO_TURN_SECRET); открыть 3478/udp+tcp и 49160-49200/udp. См. docs/DEPLOY.md, раздел 3.2.
  #   docker compose -f deploy/docker-compose.yml --profile https --profile turn up -d
  turn:
    image: coturn/coturn:4.6
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command: >-
      -n --no-cli --no-tls --no-dtls --fingerprint
      --listening-port=3478 --min-port=49160 --max-port=49200
      --use-auth-secret --static-auth-secret=${TOMATO_TURN_SECRET:-change-me}
      --realm=antistall --external-ip=${PUBLIC_IP:-127.0.0.1}
      --no-multicast-peers --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255 --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255

volumes:
  tomato-data:
  tomato-demo-data:
  caddy-data:
