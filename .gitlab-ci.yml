include:
  - project: pipelines/pipelines
    ref: master
    file:
      - /jobs/spirit.yaml
      - /jobs/build.yaml
      - /jobs/rules.yaml

stages:
  - test
  - build
  - deploy

# CI-переменные задаются в Spirit, а не в GitLab-е:
# Код → Репозитории → ваш репозиторий → вкладка CI-переменные. Полный список — docs/DEPLOY.md.
#   DEPLOY_HOST           — публичный IP/адрес ВМ (обязательно)
#   DEPLOY_USER           — пользователь на ВМ (по умолчанию root)
#   DEPLOY_KEY            — приватный SSH-ключ к ВМ, тип «Файл» (обязательно, секрет)
#   SPIRIT_DOCKER_SA_KEY  — ключ сервис-аккаунта registry, тип «Файл» (обязательно, секрет)
#   NODE_IMAGE            — базовый node-образ (≥ 22.13), если Docker Hub недоступен из сборки
#   APP_PORT / DEMO_PORT  — порты стендов на ВМ (по умолчанию 80 и 8081)
# Переменная репозитория приоритетнее значения в этом файле, поэтому всё,
# что задано ниже, можно переопределить из Spirit без правки файла.
variables:
  # Адрес Docker Registry Spirit. Без него Kaniko пушит в Docker Hub и получает 401
  DOCKER_ARTIFACTORY_REGISTRY: registry.spirit.t-education.com
  # Имя образа в Spirit Registry: registry.spirit.t-education.com/<тенант>/<репозиторий>:<sha>
  IMAGE_NAME: ${DOCKER_ARTIFACTORY_REGISTRY}/${CI_PROJECT_ROOT_NAMESPACE}/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}
  # Публичный адрес ВМ. Впишите свой сюда или создайте переменную DEPLOY_HOST
  # в Spirit (переменная репозитория приоритетнее этого значения)
  DEPLOY_HOST: CHANGE_ME_VM_IP
  # Пользователь на ВМ. По умолчанию root; чтобы сменить, создайте
  # переменную DEPLOY_USER в Spirit (CI-переменные репозитория) — она приоритетнее этого значения
  DEPLOY_USER: root
  # Образ для deploy-джобы: любой, где есть dp CLI (нужен для авторизации в registry) и ssh
  DEPLOY_IMG: registry.spirit.t-education.com/cicd-images/base-noble:release-1.1.0
  # Базовый образ сборки (нужен Node >= 22.13 со встроенным node:sqlite). Если Kaniko не достаёт до Docker Hub,
  # создайте в Spirit переменную NODE_IMAGE с node-образом из внутреннего registry — она приоритетнее.
  NODE_IMAGE: node:22-bookworm-slim
  # Порты на ВМ: основной стенд и демо-стенд для жюри (ускоренное время, отдельная БД)
  APP_PORT: "80"
  DEMO_PORT: "8081"

# 0. Тесты в каждом MR и в master: backend (node --test), типы и тесты frontend (tsc + vitest).
# Пока allow_failure: true — красные тесты видны в пайплайне, но не блокируют сборку и деплой.
# Когда убедимся, что раннер стабильно запускает node-образ, флаг можно снять.
test:
  stage: test
  image: $NODE_IMAGE
  extends:
    - .rules-merge-or-master-or-parent
  allow_failure: true
  script:
    - node --version
    - cd backend && npm ci --no-audit --no-fund && npm test
    - cd ../frontend && npm ci --no-audit --no-fund && npx tsc --noEmit -p tsconfig.app.json && npx vitest run

# 1. Сборка ЕДИНОГО образа (frontend + backend: backend раздаёт собранный frontend, REST /api и WebSocket /ws
# на одном порту) через Kaniko и публикация в registry. Раньше собирался только frontend — без backend стенд не работал.
build:image:
  extends:
    - .dp_build
    - .rules-merge-or-master-or-parent
  variables:
    DOCKERFILE_PATH: $CI_PROJECT_DIR/Dockerfile
    CONTEXT: $CI_PROJECT_DIR
    KANIKO_ARGS: "--build-arg NODE_IMAGE=$NODE_IMAGE"
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        echo "✅ Образ собран и загружен в registry: $IMAGE_NAME"
        echo "➡️  Дальше деплой на ВМ (джоба deploy:vm, запускается на ветке master)"
      else
        echo "❌ Сборка образа не удалась — посмотрите ошибку выше в логе"
      fi

# Общие настройки SSH для джоб, которые ходят на ВМ
.ssh_vm:
  image: $DEPLOY_IMG
  variables:
    SSH: "ssh -i $DEPLOY_KEY -o StrictHostKeyChecking=accept-new"
    SCP: "scp -i $DEPLOY_KEY -o StrictHostKeyChecking=accept-new"
    VM: "$DEPLOY_USER@$DEPLOY_HOST"
    DP_CLI_VERSION: "14.1.3"
  before_script:
    - |
      if [ "$DEPLOY_HOST" = "CHANGE_ME_VM_IP" ] || [ -z "$DEPLOY_HOST" ]; then
        echo "Укажите адрес ВМ: CI-переменная DEPLOY_HOST в Spirit (см. docs/DEPLOY.md)"; exit 1
      fi
      if [ -z "$DEPLOY_KEY" ] || [ ! -f "$DEPLOY_KEY" ]; then
        echo "Нет SSH-ключа: CI-переменная DEPLOY_KEY в Spirit, тип «Файл» (см. docs/DEPLOY.md)"; exit 1
      fi
    # в образе может не быть ssh/scp — доустанавливаем (нужен root в образе)
    - command -v ssh >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client)
    - chmod 600 $DEPLOY_KEY

# 2. Подготовка ВМ: ставим Spirit CLI (dp), если его ещё нет
setup:vm:
  stage: deploy
  extends:
    - .ssh_vm
    - .rules-master
  script:
    - echo "🔧 Готовим виртуальную машину $DEPLOY_HOST (ставим Spirit CLI, если его нет)"
    - |
      $SSH $VM "command -v dp >/dev/null || (
        curl -fL https://spirit.t-education.com/static/cli/tedu/$DP_CLI_VERSION/linux/dp -o /tmp/dp &&
        chmod +x /tmp/dp && sudo mv /tmp/dp /usr/local/bin/dp )"
    - echo "✅ Виртуальная машина готова"

# 3. Деплой на VM по SSH (только master)
deploy:vm:
  stage: deploy
  extends:
    - .ssh_vm
    - .rules-master
  needs: ["build:image", "setup:vm"]
  resource_group: production
  script:
    - |
      if [ -z "$SPIRIT_DOCKER_SA_KEY" ] || [ ! -f "$SPIRIT_DOCKER_SA_KEY" ]; then
        echo "Нет ключа registry: CI-переменная SPIRIT_DOCKER_SA_KEY в Spirit, тип «Файл» (см. docs/DEPLOY.md)"; exit 1
      fi
    - echo "🚀 Запускаем деплой образа $IMAGE_NAME на $DEPLOY_HOST (основной стенд :$APP_PORT, демо :$DEMO_PORT)"
    # кладём на ВМ compose единого образа (сервисы app и demo, тома с БД) и ключ сервис-аккаунта;
    # параметры (образ, порты) compose берёт из ~/app/.env
    - $SSH $VM "mkdir -p ~/app"
    - $SCP deploy/docker-compose.yml $SPIRIT_DOCKER_SA_KEY $VM:app/
    # на ВМ: входим в registry, скачиваем новый образ и перезапускаем оба стенда.
    # Имя образа пишем в ~/app/current_image, предыдущее — в ~/app/previous_image (для отката, docs/DEPLOY.md).
    # dp и docker запускаем через sudo: dp пишет helper в /usr/local/bin, это требует root
    - |
      $SSH $VM "cd ~/app &&
        sudo dp auth service-acc --key-file $(basename $SPIRIT_DOCKER_SA_KEY) &&
        sudo dp auth configure-docker &&
        echo IMAGE_NAME=$IMAGE_NAME > .env && echo APP_PORT=$APP_PORT >> .env && echo DEMO_PORT=$DEMO_PORT >> .env &&
        sudo docker compose --profile demo pull app demo &&
        sudo docker compose --profile demo up -d --no-build app demo &&
        { [ -f current_image ] && cp current_image previous_image || true; } &&
        echo $IMAGE_NAME > current_image"
    - echo "⏳ Ждём, пока оба стенда ответят"
    - |
      ok=1
      for port in $APP_PORT $DEMO_PORT; do
        if $SSH $VM "curl -fsS --retry 20 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:$port/api/health"; then
          echo "✅ http://$DEPLOY_HOST:$port отвечает"
        else
          echo "❌ http://$DEPLOY_HOST:$port не отвечает. На ВМ: cd ~/app && sudo docker compose --profile demo logs"; ok=0
        fi
      done
      [ "$ok" = 1 ] && echo "🎉 Готово! Основной стенд: http://$DEPLOY_HOST:$APP_PORT, демо для жюри: http://$DEPLOY_HOST:$DEMO_PORT"
      [ "$ok" = 1 ]
  environment:
    name: production
    url: http://$DEPLOY_HOST:$APP_PORT
